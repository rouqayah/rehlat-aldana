<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>رحلة الدانة — لعبة العلوم</title>
<style>
  :root{--sand:#f3e2c0;--mud:#c8955a;--mud-d:#8a5a2b;--sea:#1f8a9e;--sea-d:#0f5566;--gold:#f2b632;--ink:#3b2412;--cream:#fff8ec;--ok:#3f9b4f;--bad:#d4543c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#123;font-family:"Tajawal","Noto Kufi Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0;overflow:hidden}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;text-align:center;z-index:5}
  .screen.on{display:flex}
  #sEnd,#sMap{justify-content:flex-start;overflow-y:auto}
  #sEnd>.cert{margin-top:auto}
  #sEnd>.hint-small{margin-bottom:auto;padding-bottom:12px}
  .bgimg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1}
  .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  h1.title{font-size:clamp(44px,11vw,96px);margin:0;color:#fff;text-shadow:0 4px 0 var(--mud-d),0 8px 24px rgba(0,0,0,.45);letter-spacing:1px}
  .subtitle{max-width:88vw;color:#fff;font-size:clamp(15px,3.9vw,26px);line-height:1.6;margin:6px 0 22px;text-shadow:0 2px 8px rgba(0,0,0,.6);font-weight:700}
  .btn{appearance:none;border:0;border-radius:18px;padding:14px 34px;font:inherit;font-weight:800;font-size:clamp(19px,5vw,26px);cursor:pointer;background:linear-gradient(180deg,#ffd166,#f2a91f);color:#4a2a05;box-shadow:0 6px 0 #b97a0c,0 10px 20px rgba(0,0,0,.25);transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b97a0c}
  .btn.sea{background:linear-gradient(180deg,#38b6c9,#1f8a9e);color:#fff;box-shadow:0 6px 0 #0f5566,0 10px 20px rgba(0,0,0,.25)}
  .btn.small{font-size:clamp(15px,4vw,19px);padding:9px 18px;border-radius:14px}
  .btn[disabled]{filter:grayscale(.7);opacity:.6}
  .linkbtn{background:none;border:0;color:#fff;font:inherit;font-size:14px;text-decoration:underline;opacity:.85;cursor:pointer;margin-top:10px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .card{background:var(--cream);border-radius:24px;padding:20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:560px;width:100%;border:4px solid var(--mud)}
  .chars{display:flex;gap:14px;justify-content:center;margin:12px 0}
  .char{flex:1;max-width:200px;background:#fff;border:4px solid transparent;border-radius:20px;padding:8px;cursor:pointer;transition:.15s;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .char img{width:100%;height:clamp(150px,30vh,260px);object-fit:contain}
  .char b{display:block;font-size:20px;margin-top:4px}
  .char.sel{border-color:var(--gold);transform:translateY(-4px) scale(1.03);box-shadow:0 10px 24px rgba(242,182,50,.5)}
  input.name{font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid var(--mud);width:100%;max-width:320px;text-align:center;margin:6px 0 14px;background:#fff}
  .story{display:flex;gap:12px;align-items:flex-end;max-width:640px;width:100%}
  .story img{width:clamp(90px,24vw,150px);flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
  .bubble{background:var(--cream);border-radius:22px;padding:16px 18px;font-size:clamp(17px,4.4vw,22px);line-height:1.7;text-align:right;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid var(--mud)}
  .bubble b{color:var(--sea-d)}
  .bubble .who{font-weight:800;color:var(--mud-d);font-size:.85em;display:block;margin-bottom:4px}
  #hud{position:absolute;top:0;left:0;right:0;z-index:4;display:none;padding:8px 10px;pointer-events:none}
  #hud.on{display:block}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:52px}
  .pill{background:rgba(255,248,236,.92);border-radius:999px;padding:5px 12px;font-weight:800;font-size:clamp(15px,3.8vw,20px);box-shadow:0 3px 8px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .task{margin:8px auto 0;background:linear-gradient(180deg,#2aa3b8,#167a8c);color:#fff;border-radius:16px;padding:8px 14px;font-weight:800;font-size:clamp(16px,4.3vw,23px);max-width:680px;text-align:center;box-shadow:0 4px 0 #0f5566,0 8px 18px rgba(0,0,0,.25);line-height:1.45}
  .task small{display:block;font-weight:600;font-size:.72em;opacity:.95}
  .chain{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .chain span{background:rgba(255,255,255,.22);border-radius:10px;padding:2px 8px;font-size:.78em}
  .chain span.done{background:#ffd166;color:#4a2a05}
  .chain span.next{outline:3px solid #ffd166}
  .prog{height:12px;background:rgba(0,0,0,.25);border-radius:99px;margin:8px auto 0;max-width:680px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#f2a91f);border-radius:99px;transition:width .3s}
  #pauseBtn{pointer-events:auto;cursor:pointer;border:0;padding:0;box-shadow:none;background:none;font-size:inherit}
  #muteBtn{position:absolute;top:8px;left:10px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:22px;background:rgba(255,248,236,.92);box-shadow:0 3px 8px rgba(0,0,0,.25)}
  #muteBtn.off{opacity:.6}
  #modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,20,30,.55);padding:16px;overflow-y:auto}
  #modal.on{display:flex}
  #modal .story{animation:pop .25s ease-out;margin:auto}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{font:inherit;font-size:clamp(17px,4.4vw,21px);font-weight:700;text-align:right;padding:12px 14px;border-radius:14px;border:3px solid #e6cfa5;background:#fff;cursor:pointer;color:var(--ink)}
  .opt.right{background:#dff5e1;border-color:var(--ok)}
  .opt.wrong{background:#fde3dc;border-color:var(--bad)}
  .stars{font-size:clamp(34px,9vw,52px);letter-spacing:6px;margin:6px 0}
  .stars .off{filter:grayscale(1);opacity:.35}
  .cert{background:#fffaf0;border:10px double var(--mud);border-radius:18px;padding:18px 16px;max-width:620px;width:100%;box-shadow:0 14px 50px rgba(0,0,0,.45)}
  .cert h2{margin:0;color:var(--mud-d);font-size:clamp(26px,7vw,40px)}
  .cert .nm{font-size:clamp(28px,8vw,46px);font-weight:900;color:var(--sea-d);margin:6px 0;border-bottom:3px dashed var(--mud);display:inline-block;padding:0 16px}
  .cert p{font-size:clamp(16px,4.2vw,21px);line-height:1.7;margin:6px 0}
  .cert .row{display:flex;gap:10px;align-items:center;justify-content:center}
  .cert img.house{width:clamp(100px,26vw,170px)}
  .cert img.av{height:clamp(110px,22vh,170px)}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .ctrl{position:absolute;bottom:10px;left:0;right:0;display:none;justify-content:space-between;padding:0 10px;z-index:4;pointer-events:none;gap:10px}
  .ctrl.on{display:flex}
  #ctrl button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;font-size:30px;background:rgba(255,248,236,.85);box-shadow:0 4px 10px rgba(0,0,0,.3);color:var(--mud-d);font-weight:900}
  #sortCtrl button{pointer-events:auto;flex:0 1 46%;max-width:240px;height:58px;border-radius:18px;border:0;font:inherit;font-size:clamp(17px,4.6vw,22px);font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.25);cursor:pointer}
  #sortCtrl .inh{background:linear-gradient(180deg,#ffd166,#f2a91f);color:#4a2a05}
  #sortCtrl .acq{background:linear-gradient(180deg,#38b6c9,#1f8a9e);color:#fff}
  .hint-small{color:#fff;font-size:15px;margin-top:10px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  /* family puzzle */
  #fam{position:absolute;left:0;right:0;bottom:0;top:0;z-index:3;display:none;align-items:center;justify-content:center;padding:150px 10px 10px}
  #fam.on{display:flex}
  .famBox{background:rgba(255,248,236,.95);border:4px solid var(--mud);border-radius:22px;padding:12px;max-width:640px;width:100%;box-shadow:0 12px 34px rgba(0,0,0,.35);max-height:100%;overflow-y:auto}
  .parents{display:flex;gap:10px;justify-content:center;align-items:flex-start}
  .par{flex:1;max-width:220px;background:#fff;border-radius:16px;padding:6px;border:3px solid #e6cfa5}
  .par img{width:clamp(70px,20vw,110px);height:auto}
  .par b{display:block;font-size:clamp(15px,4vw,18px)}
  .chip{display:inline-block;background:#f3e2c0;border-radius:8px;padding:1px 6px;margin:2px;font-size:clamp(11px,3vw,13px);font-weight:700}
  .heart{font-size:28px;align-self:center}
  .kids{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  @media (max-width:520px){.kids{grid-template-columns:repeat(2,1fr)}.kid img{max-width:100px}.par img{width:64px}.famBox{padding:8px}#fam{padding-top:140px}}
  @media (max-height:700px){.kid img{max-width:72px}.par img{width:56px}}
  .kid{background:#fff;border:3px solid #e6cfa5;border-radius:16px;padding:4px;cursor:pointer;transition:.12s}
  .kid img{width:100%;max-width:110px;height:auto}
  .kid:active{transform:scale(.96)}
  .kid.right{border-color:var(--ok);background:#dff5e1}
  .kid.wrong{border-color:var(--bad);background:#fde3dc}
  .timer{height:10px;background:#e6cfa5;border-radius:99px;overflow:hidden;margin-top:8px}
  .timer i{display:block;height:100%;background:linear-gradient(90deg,#d4543c,#f2a91f);width:100%}
  .mcols{display:flex;gap:10px}
  .mcol{flex:1;display:flex;flex-direction:column;gap:8px}
  .mbtn{font:inherit;font-weight:800;font-size:clamp(14px,3.8vw,18px);padding:10px 8px;border-radius:14px;border:3px solid #e6cfa5;background:#fff;color:var(--ink);cursor:pointer;min-height:56px;line-height:1.35}
  .mbtn.term{background:#fff3d6;border-color:#c8955a}
  .mbtn.sel{outline:4px solid #f2a91f;transform:scale(1.03)}
  .mbtn.done{border-color:var(--ok);opacity:.85;cursor:default}
  #choiceCtrl{position:absolute;bottom:10px;left:0;right:0;display:none;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 10px;z-index:4}
  #choiceCtrl.on{display:flex}
  #choiceCtrl button{flex:1 1 30%;max-width:260px;min-height:56px;border-radius:16px;border:0;font:inherit;font-weight:900;font-size:clamp(15px,4.2vw,20px);cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.25);line-height:1.25;padding:6px}
  #choiceCtrl button:active{transform:translateY(3px)}
  #choiceCtrl.four button{flex:1 1 44%}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
  .confetti span{position:absolute;top:-40px;animation:fall 4.5s linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  /* map */
  .mapWrap{max-width:560px;width:100%;margin:auto 0}
  .mapTitle{color:#fff;font-size:clamp(28px,7vw,44px);font-weight:900;text-shadow:0 3px 0 var(--mud-d),0 6px 18px rgba(0,0,0,.5);margin:6px 0}
  .mapHello{color:#fff;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:10px;font-size:clamp(15px,4vw,19px)}
  .node{display:flex;align-items:center;gap:12px;background:rgba(255,248,236,.95);border:4px solid var(--mud);border-radius:20px;padding:10px 12px;margin:8px 0;text-align:right;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative}
  .node .ic{font-size:34px;width:54px;height:54px;border-radius:50%;background:#f3e2c0;display:flex;align-items:center;justify-content:center;flex:none}
  .node .tx{flex:1}
  .node .tx b{display:block;font-size:clamp(17px,4.6vw,22px)}
  .node .tx span{font-size:clamp(13px,3.6vw,16px);opacity:.85}
  .node .st{font-size:18px;white-space:nowrap}
  .node.lock{filter:grayscale(.85);opacity:.72;cursor:default}
  .node.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,182,50,.5),0 6px 16px rgba(0,0,0,.3);animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 8px rgba(242,182,50,.25),0 6px 16px rgba(0,0,0,.3)}}
  .pearlTot{display:inline-block;background:rgba(255,248,236,.92);border-radius:99px;padding:4px 14px;font-weight:800;margin-bottom:6px}
  @media (max-width:520px){
    .story{flex-direction:column;align-items:center;gap:0}
    .story img{width:84px;margin-bottom:-14px;position:relative;z-index:2}
    .bubble{padding-top:20px}
  }
</style>
</head>
<body>
<div id="app">
  <audio id="bgm" src="game-assets/music.mp3" loop preload="auto"></audio>
  <button id="muteBtn" aria-label="الموسيقى">🎵</button>
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hrow">
      <div class="pill" id="pearls">🦪 <span>0</span></div>
      <div class="pill" id="hearts">❤️❤️❤️</div>
      <div class="pill"><button id="pauseBtn">⏸️</button></div>
    </div>
    <div class="task" id="task"></div>
    <div class="prog"><i id="progBar"></i></div>
  </div>
  <div class="ctrl" id="ctrl"><button id="bR" aria-label="يمين">▶</button><button id="bL" aria-label="يسار">◀</button></div>
  <div class="ctrl" id="sortCtrl"><button class="inh" id="sR">🧬 وراثية</button><button class="acq" id="sL">📚 مكتسبة</button></div>
  <div id="choiceCtrl"></div>
  <div id="fam"><div class="famBox" id="famBox"></div></div>

  <section class="screen on" id="sTitle">
    <div class="bgimg" style="background-image:url(game-assets/title.webp)"></div>
    <h1 class="title">رحلة الدانة</h1>
    <div class="subtitle">رحلة علمية في جسم الإنسان 🧬 من الفريج إلى أعماق البحر</div>
    <button class="btn" id="goStart">ابدأ الرحلة</button>
    <div class="hint-small">العلوم — الصف الرابع — الفصل الأول: تركيب جسم الإنسان</div>
  </section>

  <section class="screen" id="sChar">
    <div class="bgimg" style="background-image:url(game-assets/fareej.webp)"></div>
    <div class="card" style="margin:auto">
      <div style="font-size:clamp(20px,5vw,28px);font-weight:900">اختر شخصيتك</div>
      <div class="chars">
        <div class="char" data-c="boy"><img src="game-assets/boy.webp" alt="ولد بالدشداشة والقحفية"><b>بحّار الفريج</b></div>
        <div class="char" data-c="girl"><img src="game-assets/girl.webp" alt="بنت بالدراعة والبخنق"><b>بنت الفريج</b></div>
      </div>
      <input class="name" id="nameIn" maxlength="18" placeholder="اكتب اسمك هنا" autocomplete="off">
      <br><button class="btn" id="goMap" disabled>هيا بنا!</button>
    </div>
  </section>

  <section class="screen" id="sMap">
    <div class="bgimg" style="background-image:url(game-assets/title.webp)"></div>
    <div class="mapWrap">
      <div class="mapTitle">🗺️ خريطة الرحلة</div>
      <div class="mapHello" id="mapHello"></div>
      <div class="pearlTot" id="mapPearls"></div>
      <div id="nodes"></div>
      <button class="linkbtn" id="teacherBtn">🔑 للمعلمة: فتح جميع المراحل</button>
      <br><button class="linkbtn" id="changeChar">تغيير الشخصية أو الاسم</button>
    </div>
  </section>

  <section class="screen" id="sStory">
    <div class="bgimg" id="storyBg"></div>
    <div class="story">
      <img src="game-assets/nokh.webp" alt="النوخذة">
      <div class="bubble"><span class="who">النوخذة بو سالم</span><span id="storyTxt"></span>
        <div class="btnrow" style="justify-content:flex-start"><button class="btn sea" id="storyNext">التالي ⬅</button></div>
      </div>
    </div>
  </section>

  <section class="screen" id="sEnd">
    <div class="bgimg" style="background-image:url(game-assets/title.webp)"></div>
    <div class="cert">
      <h2 id="certTitle"></h2>
      <p>يشهد النوخذة بو سالم أنّ البحّار</p>
      <div class="nm" id="certName"></div>
      <div class="row"><img class="av" id="certAv" alt=""><img class="house" id="certImg" alt=""></div>
      <p id="certText"></p>
      <div class="stars" id="certStars"></div>
      <p style="font-weight:800">🦪 لؤلؤ هذه المرحلة: <span id="certPearls"></span></p>
      <p style="font-size:15px;opacity:.75" id="certDate"></p>
    </div>
    <div class="btnrow">
      <button class="btn sea" id="toMapBtn">🗺️ خريطة الرحلة</button>
      <button class="btn" id="againBtn">🔁 العب المرحلة مرة أخرى</button>
    </div>
    <div class="hint-small" id="endHint"></div>
  </section>

  <div id="modal"><div class="story">
    <img src="game-assets/nokh.webp" alt="النوخذة">
    <div class="bubble" style="flex:1"><span class="who">النوخذة بو سالم</span><div id="modalTxt"></div><div id="modalExtra"></div>
      <div class="btnrow" style="justify-content:flex-start" id="modalBtns"></div></div>
  </div></div>
</div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const IMG={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.onerror=r;i.src=src;})}
const SRC={girl:'game-assets/girl.webp',boy:'game-assets/boy.webp',fareej:'game-assets/fareej.webp',house:'game-assets/house.webp',hosh:'game-assets/hosh.webp',nagaa:'game-assets/nagaa.webp',tray:'game-assets/tray.webp',deep:'game-assets/deep.webp',diver:'game-assets/diver.webp',dayyin:'game-assets/dayyin.webp',midsea:'game-assets/midsea.webp',heartcap:'game-assets/heartcap.webp',final:'game-assets/title.webp',oysclosed:'game-assets/oysc.webp',oysopen:'game-assets/oyso.webp',dana:'game-assets/dana.webp',chest:'game-assets/chest.webp',slate:'game-assets/slate.webp'};
Object.entries(SRC).forEach(([k,v])=>loadImg(k,v));
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* =================== CONTENT =================== */
/* ---- Stage 1: lesson 1 (cell) ---- */
const PARTS={
  wall:{n:'الجدار الخلوي',f:'يعطي الخلية شكلًا منتظمًا ويحميها'},
  memb:{n:'الغشاء الخلوي',f:'ينظّم مرور المواد من الخلية وإليها'},
  nuc:{n:'النواة',f:'تتحكم في جميع أنشطة الخلية'},
  mito:{n:'الميتوكندريا',f:'مصدر الطاقة في الخلية'},
  chlo:{n:'البلاستيدات الخضراء',f:'تصنع الغذاء باستخدام الضوء'},
};
const JUNK=['الشراع','المجداف','الحبل','الرمل','الصدفة','الفنر'];
const SEQ=['الخلية','النسيج','العضو','الجهاز'];
const ORDER_FACTS={'الخلية':'أصغر وحدة بنائية في جسم الكائن الحي','النسيج':'مجموعة خلايا متشابهة تعمل معًا','العضو':'مجموعة أنسجة تعمل معًا','الجهاز':'مجموعة أعضاء تعمل معًا لوظيفة حيوية'};

/* ---- Stage 2: lesson 2 (heredity) ---- */

/* =================== MODE: MATCH (stage 4) =================== */
function startBoard(){
  const B=BOARDS[G.board]; const left=shuffle(B.pairs.map((p,i)=>({t:p[1],i}))); const right=B.pairs.map((p,i)=>({t:p[0],i}));
  $('#famBox').innerHTML=`<div style="font-weight:900;font-size:clamp(17px,4.6vw,22px);margin-bottom:8px">🪢 ${B.title} <span style="opacity:.6;font-size:.8em">(${G.board+1}/${BOARDS.length})</span></div>
   <div class="mcols"><div class="mcol">${right.map(r=>`<button class="mbtn term" data-i="${r.i}">${r.t}</button>`).join('')}</div>
   <div class="mcol">${left.map(l=>`<button class="mbtn def" data-i="${l.i}">${l.t}</button>`).join('')}</div></div>`;
  G.msel=null;
  document.querySelectorAll('.mbtn.term').forEach(b=>b.onclick=()=>{ if(G.paused||b.classList.contains('done'))return; SFX.click();
    document.querySelectorAll('.mbtn.term').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); G.msel=b; });
  document.querySelectorAll('.mbtn.def').forEach(b=>b.onclick=()=>{ if(G.paused||b.classList.contains('done'))return;
    const r=b.getBoundingClientRect();
    if(!G.msel){floatTxt('اختر الكلمة أولًا ☝️',r.left+r.width/2,r.top,'#fff',20);return}
    const t=G.msel;
    if(+t.dataset.i===+b.dataset.i){ t.classList.remove('sel'); t.classList.add('done'); b.classList.add('done'); G.matchCol++;
      t.style.background=b.style.background=['#ffd166','#9be7c4','#b9d6ff','#f8c2d4'][G.matchCol%4]; G.msel=null; good(r.left+r.width/2,r.top,'#ffd166');
      if(document.querySelectorAll('.mbtn.term:not(.done)').length===0){ if(G.got>=LV().need)afterGood(); else { G.board++; setTimeout(()=>{if(G.running)startBoard()},700) } } }
    else { const B=BOARDS[G.board]; const correct=B.pairs[+t.dataset.i][1]; t.classList.remove('sel'); G.msel=null;
      bad(t.textContent,`ليست هذه! «<b>${t.textContent}</b>»: ${correct}.`,r.left+r.width/2,r.top); }
  });
}

/* =================== MODE: VOYAGE (stage 5) =================== */
function mapBox(){const top=Math.max(W<520?250:225,H*.3), bot=H-(W<520?150:100); return {x:12,y:top,w:W-24,h:bot-top}}
function vgeo(){const m=mapBox(); const heart={x:m.x+m.w/2,y:m.y+m.h*.55};
  const isl=[{n:'الرأس',e:'🧠',x:m.x+m.w/2,y:m.y+m.h*.16,side:1},{n:'اليد',e:'✋',x:m.x+m.w*.14,y:m.y+m.h*.66,side:1},{n:'القدم',e:'🦶',x:m.x+m.w*.86,y:m.y+m.h*.82,side:-1}];
  return {m,heart,isl};}
function vpath(i,kind){ // returns bezier control for artery ('a') or vein ('v')
  const g=vgeo(), a=g.heart, b=g.isl[i]; const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
  const off=Math.max(52,Math.min(80,l*.38))*(kind==='a'?1:-1); return {a,b,c:{x:mx-dy/l*off,y:my+dx/l*off},n:{x:-dy/l*(kind==='a'?1:-1),y:dx/l*(kind==='a'?1:-1)}};}
function bez(p,t){const u=1-t;return {x:u*u*p.a.x+2*u*t*p.c.x+t*t*p.b.x,y:u*u*p.a.y+2*u*t*p.c.y+t*t*p.b.y}}
function initVoyage(){G.vq=shuffle([0,1,2]);G.vs={isl:G.vq[0],phase:'heart',anim:null,cargo:'full'};}
function vChoose(c){
  if(!G.running||G.paused||G.vs.anim)return; const v=G.vs, I=vgeo().isl[v.isl].n;
  const ok=(v.phase==='heart'&&c==='art')||(v.phase==='atFull'&&c==='cap')||(v.phase==='atWaste'&&c==='vein');
  if(ok){ SFX.whoosh();
    if(c==='art'){v.anim={kind:'a',t:0,dir:1,next:'atFull'};fact('🔴 الشريان: ينقل الدم من القلب إلى أجزاء الجسم.',mapBox().y-6)}
    if(c==='cap'){v.anim={kind:'x',t:0,next:'atWaste'};fact('🔄 الشعيرات الدموية: فيها يحدث تبادل المواد بين الدم وأجزاء الجسم.',mapBox().y-6)}
    if(c==='vein'){v.anim={kind:'v',t:0,dir:-1,next:'heart'};fact('🔵 الوريد: ينقل الدم من أجزاء الجسم إلى القلب.',mapBox().y-6)}
    const g=vgeo(); const p=v.phase==='heart'?g.heart:g.isl[v.isl]; good(p.x,p.y-20,'#e74c3c');
  } else {
    let why='';
    if(v.phase==='heart') why = c==='vein' ? '<b>الوريد</b> ينقل الدم <b>من أجزاء الجسم إلى القلب</b>!<br>للخروج من القلب إلى أجزاء الجسم نستخدم <b>الشريان</b> 🔴.' : 'تبادل المواد يحدث عند أجزاء الجسم في <b>الشعيرات الدموية</b>، وليس في القلب.<br>أولًا: انطلق من القلب عبر <b>الشريان</b> 🔴.';
    else if(v.phase==='atFull') why = `وصلت إلى «${I}»! الآن سلّم الأكسجين والغذاء وخذ الفضلات… وهذا يحدث في <b>الشعيرات الدموية</b> 🔄: فيها يحدث تبادل المواد بين الدم وأجزاء الجسم.`;
    else why = c==='art' ? '<b>الشريان</b> ينقل الدم <b>من القلب إلى أجزاء الجسم</b>.<br>للعودة إلى القلب نستخدم <b>الوريد</b> 🔵.' : 'تمّ تبادل المواد! الآن عُد إلى القلب عبر <b>الوريد</b> 🔵.';
    const g=vgeo(); const p=v.phase==='heart'?g.heart:g.isl[v.isl]; bad(null,why,p.x,p.y);
  }
}
function updateVoyage(dt){
  const v=G.vs; if(!v.anim)return; v.anim.t+=dt/(v.anim.kind==='x'?.9:1.5);
  if(v.anim.kind==='x'&&Math.random()<.5){const p=vgeo().isl[v.isl];G.fx.push({type:'p',x:p.x+(Math.random()-.5)*40,y:p.y,vx:(Math.random()-.5)*120,vy:-Math.random()*160,r:3,c:Math.random()<.5?'#e74c3c':'#7a6a55',life:.6,max:.6})}
  if(v.anim.t>=1){ v.phase=v.anim.next;
    if(v.anim.kind==='x')v.cargo='waste';
    if(v.phase==='heart'){ v.cargo='full'; G.vq.push(G.vq.shift()); v.isl=G.vq[0]; floatTxt('❤️ القلب يضخّ الدم من جديد!',vgeo().heart.x,vgeo().heart.y-50,'#fff',22); }
    v.anim=null; setTask(); afterGood(); }
}
function shipPos(){const v=G.vs,g=vgeo(); if(v.anim&&(v.anim.kind==='a'||v.anim.kind==='v')){const p=vpath(v.isl,v.anim.kind);const t=Math.min(1,v.anim.t);return bez(p,v.anim.kind==='a'?t:1-t)}
  const R=Math.min(34,W*.08); return v.phase==='heart'?{x:g.heart.x-Math.min(56,W*.13)*.55-30,y:g.heart.y+6}:{x:g.isl[v.isl].x+(g.isl[v.isl].side>0?-1:1)*(R+30),y:g.isl[v.isl].y+R*.5}}
function drawShip(x,y,cargo){cx.save();cx.translate(x,y+Math.sin(G.t*4)*2);
  cx.fillStyle='#7a4b20';cx.beginPath();cx.moveTo(-22,0);cx.lineTo(22,0);cx.lineTo(15,10);cx.lineTo(-15,10);cx.closePath();cx.fill();
  cx.strokeStyle='#5a3a1a';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,-30);cx.stroke();
  cx.fillStyle=cargo==='full'?'#e74c3c':'#8e7d6a';cx.beginPath();cx.moveTo(2,-30);cx.lineTo(22,-4);cx.lineTo(2,-4);cx.closePath();cx.fill();
  cx.font='16px '+FONT;cx.textAlign='center';cx.fillText(cargo==='full'?'🫁🍞':'🗑️',-10,-12);cx.restore();}
function drawVoyage(){
  const g=vgeo(), m=g.m; cx.save();
  rr(m.x,m.y,m.w,m.h,22);cx.fillStyle='rgba(244,228,193,.94)';cx.fill();cx.strokeStyle='#8a5a2b';cx.lineWidth=4;cx.stroke();
  // paths
  g.isl.forEach((s,i)=>{for(const k of ['a','v']){const p=vpath(i,k);cx.strokeStyle=k==='a'?'rgba(214,48,49,.85)':'rgba(41,98,201,.85)';cx.lineWidth=i===G.vs.isl?7:4;cx.setLineDash(i===G.vs.isl?[]:[8,8]);
    cx.beginPath();cx.moveTo(p.a.x,p.a.y);cx.quadraticCurveTo(p.c.x,p.c.y,p.b.x,p.b.y);cx.stroke();cx.setLineDash([]);
    if(i===G.vs.isl){const q0=bez(p,.5);const q={x:q0.x+p.n.x*14,y:q0.y+p.n.y*14};cx.font=`800 ${Math.min(14,W*.034)}px ${FONT}`;cx.direction='rtl';cx.textAlign='center';const lab=k==='a'?'شريان':'وريد';const tw=cx.measureText(lab).width+12;
      rr(q.x-tw/2,q.y-11,tw,22,8);cx.fillStyle=k==='a'?'#d63031':'#2962c9';cx.fill();cx.fillStyle='#fff';cx.fillText(lab,q.x,q.y+5)}}});
  // islands
  g.isl.forEach((s,i)=>{cx.save();cx.fillStyle=i===G.vs.isl?'#f7d794':'#ead7b0';cx.strokeStyle='#8a5a2b';cx.lineWidth=3;cx.beginPath();cx.arc(s.x,s.y,Math.min(34,W*.08),0,7);cx.fill();cx.stroke();
    cx.font=`${Math.min(28,W*.065)}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s.e,s.x,s.y);
    const R=Math.min(34,W*.08); cx.font=`900 ${Math.min(16,W*.038)}px ${FONT}`;cx.direction='rtl';const tw=cx.measureText(s.n).width+14;
    const lx=s.side>0? s.x+R+6+tw/2 : s.x-R-6-tw/2; rr(lx-tw/2,s.y-13,tw,26,9);cx.fillStyle='rgba(255,255,255,.95)';cx.fill();cx.strokeStyle='#8a5a2b';cx.lineWidth=2;cx.stroke();
    cx.fillStyle='#3b2412';cx.fillText(s.n,lx,s.y+1);cx.restore()});
  // heart
  const beat=1+.08*Math.max(0,Math.sin(G.t*7)); cx.save();cx.translate(g.heart.x,g.heart.y);cx.scale(beat,beat);cx.font=`${Math.min(56,W*.13)}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('❤️',0,0);cx.restore();
  cx.save();cx.font=`900 ${Math.min(16,W*.038)}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.direction='rtl';const hl='القلب ❤️ الميناء';const hw=cx.measureText(hl).width+16;const hy=g.heart.y+Math.min(56,W*.13)*.62+14;
  rr(g.heart.x-hw/2,hy-13,hw,26,9);cx.fillStyle='rgba(255,255,255,.95)';cx.fill();cx.strokeStyle='#b71c1c';cx.lineWidth=2;cx.stroke();cx.fillStyle='#b71c1c';cx.fillText(hl,g.heart.x,hy+1);cx.restore();

  plt:{n:'الصفائح الدموية',e:'🟡',f:'تساعد على تجلّط الدم لالتئام الجروح'},plasma:{n:'البلازما',e:'💧',f:'الجزء السائل من الدم الذي تسبح فيه باقي المكوّنات'}};

function face(p,opt){ // returns dataURL

  // nose, cheeks, mouth

  x.fillStyle='rgba(230,90,90,.22)';x.beginPath();x.arc(cxm-hr*.6,cy+hr*.5,hr*.14,0,7);x.arc(cxm+hr*.6,cy+hr*.5,hr*.14,0,7);x.fill();

function traitWord(k,v){return `${TRAITS[k].lab}: ${v}`}
function makePuzzle(){

  // child: mix, at least one trait from each where they differ
  let C; const diff=TKEYS.filter(k=>F[k]!==M[k]);
  do{C={};TKEYS.forEach(k=>C[k]=Math.random()<.5?F[k]:M[k])}while(!(diff.some(k=>C[k]===F[k])&&diff.some(k=>C[k]===M[k])));
  // distractors: change traits to values held by neither parent
  const outside=k=>Object.keys(TRAITS[k].v).filter(v=>v!==F[k]&&v!==M[k]);
  const changeable=TKEYS.filter(k=>outside(k).length);
  const ds=[];let guard=0;
  while(ds.length<3&&guard++<200){const d={...C};const ks=shuffle(changeable).slice(0,Math.min(changeable.length,1+Math.floor(Math.random()*2)));
    ks.forEach(k=>d[k]=pick(outside(k))); const key=JSON.stringify(d); if(ks.length&&!ds.some(x=>JSON.stringify(x)===key))ds.push(d)}
  const fem=Math.random()<.5;

}
function famExplain(P,kid){
  const fromF=[],fromM=[],both=[];
  TKEYS.forEach(k=>{const v=kid[k];if(v===P.F[k]&&v===P.M[k])both.push(traitWord(k,v));else if(v===P.F[k])fromF.push(traitWord(k,v));else if(v===P.M[k])fromM.push(traitWord(k,v))});
  const w=P.fem?'تشبه':'يشبه', h=P.fem?'ها':'ه', s=[];
  if(fromF.length)s.push(`${w} <b>أبا${h}</b> في: ${fromF.join('، ')}`);
  if(fromM.length)s.push(`${w} <b>أمّ${h}</b> في: ${fromM.join('، ')}`);

}

  $('#certStars').innerHTML=[0,1,2,3,4].map(i=>`<span class="${i<s?'':'off'}">⭐</span>`).join('');
  $('#certDate').textContent=new Date().toLocaleDateString('ar-KW',{year:'numeric',month:'long',day:'numeric'});
  if(S.final){ const tot=Object.values(SV.pearls).reduce((a,b)=>a+b,0); $('#certText').innerHTML=S.cert.text+`<br>🦪 مجموع لؤلؤ الرحلة كلها: <b>${tot}</b>`; celebrate(); }
  const nextName = S.final ? '🎉 مبروك! أنهيت رحلة الدانة كاملة! 🇰🇼' : STAGES[G.si+1]? `المرحلة ${G.si+2} «${STAGES[G.si+1].place}» انفتحت! 🔓` : (FUTURE[G.si+1-STAGES.length]?`⛵ المرحلة ${G.si+2} «${FUTURE[G.si+1-STAGES.length].place}» قريبًا…`:'');
  $('#endHint').innerHTML=`📸 صوّر الشاشة لتحتفظ بشهادتك!<br>${nextName}`;
  show('sEnd');
}

function celebrate(){ const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<36;i++){const sp=document.createElement('span');sp.textContent=pick(['✨','🦪','⭐','🎉','👑']);sp.style.left=(Math.random()*100)+'%';sp.style.animationDelay=(Math.random()*3)+'s';sp.style.fontSize=(18+Math.random()*18)+'px';box.appendChild(sp)}
  $('#sEnd').appendChild(box); setTimeout(()=>box.remove(),9000); }
/* =================== MAP =================== */
function renderMap(){
  $('#mapHello').innerHTML= SV.done[6]? `🏆 <b>${G.name}</b>، أنت صائد الدانة! أتممت الرحلة كاملة 👑` : `أهلًا يا <b>${G.name}</b>! اختر مرحلتك 👇`;
  const tot=Object.values(SV.pearls).reduce((a,b)=>a+b,0); $('#mapPearls').textContent=`🦪 مجموع لؤلؤك: ${tot}`;
  let html='', firstOpen=-1;
  STAGES.forEach((S,i)=>{const un=unlocked(i),dn=SV.done[S.id];if(un&&!dn&&firstOpen<0)firstOpen=i;});
  STAGES.forEach((S,i)=>{const un=unlocked(i),dn=SV.done[S.id];const st=SV.stars[S.id]||0;
    html+=`<div class="node ${un?'':'lock'} ${i===firstOpen?'cur':''}" data-i="${i}"><div class="ic">${S.icon}</div><div class="tx"><b>المرحلة ${i+1}: ${S.place}</b><span>${S.lesson}</span></div>
      <div class="st">${!un?'🔒':dn?'⭐'.repeat(Math.min(st,5)).slice(0,10)||'✅':'▶️ العب'}</div></div>`});
  FUTURE.forEach((f,j)=>{html+=`<div class="node lock"><div class="ic">${f.icon}</div><div class="tx"><b>المرحلة ${STAGES.length+j+1}: ${f.place}</b><span>${f.lesson}</span></div><div class="st">قريبًا ⏳</div></div>`});
  $('#nodes').innerHTML=html;
  document.querySelectorAll('.node[data-i]').forEach(n=>n.onclick=()=>{const i=+n.dataset.i;SFX.click();
    if(!unlocked(i)){showModal(`🔒 أكمل <b>المرحلة ${i}</b> أولًا لتفتح هذه المرحلة!`,[{t:'حسنًا',f:hideModal}]);return}
    playStage(i)});
  $('#teacherBtn').textContent=SV.unlockAll?'🔒 للمعلمة: إعادة قفل المراحل':'🔑 للمعلمة: فتح جميع المراحل';
  show('sMap');
}
function playStage(i){
  G.si=i;G.pearls=0;G.stars=[];G.quizScore=0;
  G.wallTotal=STAGES[i].levels.reduce((a,l)=>a+l.need,0);
  $('#storyBg').style.backgroundImage=`url(${SRC[STAGES[i].bg]})`;
  story([...STAGES[i].intro(G.name), STAGES[i].levels[0].intro],()=>startLevel(0));
}

/* =================== LOOP =================== */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(G.running&&!G.paused){G.t+=dt;G.shake=Math.max(0,G.shake-dt*20);const L=LV(); if(L.type==='catch')updateCatch(dt); else if(L.type==='sort')updateSort(dt); else if(L.type==='runner')updateRunner(dt); else if(L.type==='fish')updateFish(dt); else if(L.type==='dive')updateDive(dt); else if(L.type==='bubble')updateBubble(dt); else if(L.type==='voyage')updateVoyage(dt); else if(L.type==='crew')updateCrew(dt); else if(L.type==='race')updateRace(dt); else if(L.type==='respond')updateRespond(dt); else if(L.type==='boss')updateBoss(dt);}
  cx.clearRect(0,0,W,H);
  if(G.bgOnly&&!G.running)drawBg();
  if(G.running){drawBg(); const L=LV();
    if(L.type==='catch'){if(ST().wall)drawWall();G.items.forEach(drawBrick);drawChar()}
    else if(L.type==='sort')drawSort();
    else if(L.type==='runner')drawRunner();
    else if(L.type==='fish')drawFish();
    else if(L.type==='dive')drawDive();
    else if(L.type==='bubble')drawBubble();
    else if(L.type==='voyage')drawVoyage();
    else if(L.type==='crew')drawCrew();
    else if(L.type==='race')drawRace();
    else if(L.type==='respond')drawRespond();
    else if(L.type==='boss')drawBoss();
    drawFx(G.paused?0:dt);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =================== UI HELPERS =================== */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function story(pages,done){ let k=0; show('sStory'); const t=$('#storyTxt'),nb=$('#storyNext');
  const draw=()=>{t.innerHTML=pages[k];nb.textContent=k<pages.length-1?'التالي ⬅':'هيا نبدأ! ⛵'}; draw();
  nb.onclick=()=>{SFX.click();k++;if(k<pages.length)draw();else{show('');done()}} }
function setBtns(btns){const box=$('#modalBtns');box.innerHTML='';btns.filter(b=>!b.hide).forEach(b=>{const e=document.createElement('button');e.className='btn small'+(b.sea?' sea':'');e.innerHTML=b.t;e.onclick=()=>{SFX.click();b.f()};box.appendChild(e)})}
function showModal(html,btns,extra=''){ $('#modalTxt').innerHTML=html; $('#modalExtra').innerHTML=extra?`<p style="margin:8px 0 0;font-weight:700;color:#1f8a9e">${extra}</p>`:''; setBtns(btns); $('#modal').classList.add('on') }
function hideModal(){ $('#modal').classList.remove('on') }

/* =================== INPUT =================== */
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(!G.running)return; const L=LV();
  if(L.type==='catch'){G.targetX=e.clientX/W;cv.setPointerCapture(e.pointerId)}
  if(L.type==='sort'||L.type==='runner'){ptr={x:e.clientX,y:e.clientY}}
  if(L.type==='fish'&&!G.paused)tapFish(e.clientX,e.clientY);
  if(L.type==='bubble'&&!G.paused)tapBubble(e.clientX,e.clientY);
  if(L.type==='race')raceTap();
  if(L.type==='dive'){G.dv.tx=e.clientX;G.dv.ty=e.clientY;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(!G.running)return; const T=LV().type; if(T==='catch'&&(e.buttons||e.pointerType==='mouse'))G.targetX=e.clientX/W; if(T==='dive'&&e.buttons){G.dv.tx=e.clientX;G.dv.ty=e.clientY}});
cv.addEventListener('pointerup',e=>{if(!G.running||!ptr)return; const T=LV().type; const dx=e.clientX-ptr.x; ptr=null;
  if(T==='runner'){ if(Math.abs(dx)>30)moveLane(dx>0?1:-1); else { const t=[0,1,2].reduce((b,i)=>Math.abs(laneX(i)-e.clientX)<Math.abs(laneX(b)-e.clientX)?i:b,0); if(t!==G.lane&&!G.paused&&G.running){G.lane=t;SFX.click()} } return }
  if(T!=='sort')return;
  if(Math.abs(dx)>30)decide(dx>0?'R':'L'); else decide(e.clientX>W/2?'R':'L');});
addEventListener('keydown',e=>{ if(!G.running)return; const L=LV();
  if(e.key==='ArrowLeft'){e.preventDefault(); if(L.type==='sort')decide('L'); else if(L.type==='runner')moveLane(-1); else G.keys.left=1}
  if(e.key==='ArrowRight'){e.preventDefault(); if(L.type==='sort')decide('R'); else if(L.type==='runner')moveLane(1); else G.keys.right=1}
  if(L.type==='dive'){if(e.key==='ArrowUp'){e.preventDefault();G.keys.up=1}if(e.key==='ArrowDown'){e.preventDefault();G.keys.down=1}}
  if(L.type==='race'&&(e.key===' '||e.key==='Enter')){e.preventDefault();raceTap();return}
  if(e.key===' '||e.key==='p')togglePause()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')G.keys.left=0;if(e.key==='ArrowRight')G.keys.right=0;if(e.key==='ArrowUp')G.keys.up=0;if(e.key==='ArrowDown')G.keys.down=0});
const hold=(btn,key)=>{const on=e=>{e.preventDefault(); if(G.running&&LV().type==='runner'){moveLane(key==='left'?-1:1);return} G.keys[key]=1},off=()=>G.keys[key]=0;btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointerleave',off);btn.addEventListener('pointercancel',off)};
hold($('#bL'),'left');hold($('#bR'),'right');
$('#sR').onclick=()=>decide('R'); $('#sL').onclick=()=>decide('L');
function togglePause(){ if(!G.running||$('#modal').classList.contains('on'))return;
  G.paused=true;showModal('⏸️ استراحة قصيرة… البحر ينتظرك!',[{t:'أكمل ⛵',f:()=>{hideModal();G.paused=false}}]) }
$('#pauseBtn').onclick=togglePause;
$('#muteBtn').onclick=()=>{G.muted=!G.muted;$('#muteBtn').textContent=G.muted?'🔇':'🎵';$('#muteBtn').classList.toggle('off',G.muted);music(!G.muted)};
document.addEventListener('visibilitychange',()=>{ if(document.hidden)BGM.pause(); else if(!G.muted&&G.musicStarted)music(true) });

/* =================== FLOW =================== */
$('#goStart').onclick=()=>{ac();SFX.click();G.musicStarted=true;music(true);
  if(SV.name&&SV.char){G.name=SV.name;G.char=SV.char;renderMap()} else openChar()};
function openChar(){ $('#nameIn').value=G.name||''; document.querySelectorAll('.char').forEach(x=>x.classList.toggle('sel',x.dataset.c===G.char)); chk(); show('sChar') }
document.querySelectorAll('.char').forEach(c=>c.onclick=()=>{SFX.click();document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');G.char=c.dataset.c;chk()});
$('#nameIn').oninput=chk;
function chk(){$('#goMap').disabled=!(G.char&&$('#nameIn').value.trim())}
$('#goMap').onclick=()=>{G.name=$('#nameIn').value.trim();SV.name=G.name;SV.char=G.char;save();SFX.click();renderMap()};
$('#changeChar').onclick=()=>{SFX.click();openChar()};
$('#teacherBtn').onclick=()=>{SV.unlockAll=!SV.unlockAll;save();renderMap()};
$('#toMapBtn').onclick=()=>{SFX.click();renderMap()};
$('#againBtn').onclick=()=>{SFX.click();playStage(G.si)};

})();
</script>
</body>
</html>
